[project]
name = "lehde-backend"
version = "0.1.0"
description = "KI-Prototyp für Ausschreibungs- und Projektunterlagen"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16",
    "anyio>=4.9",
    "asyncpg>=0.30",
    "fastapi[standard]>=0.115",
    "httpx>=0.28",
    "openai>=1.99",
    "pillow>=11",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "pypdfium2>=4.30",
    "python-docx>=1.2",
    "rapidfuzz>=3.13",
    "pytesseract>=0.3.13",
    "reportlab>=4.4",
    "rich>=14",
    "sqlalchemy[asyncio]>=2.0.40",
    "sqlmodel>=0.0.24",
    "structlog>=25",
    "tenacity>=9",
    "uvicorn[standard]>=0.35",
]

[tool.uv]
package = false

[tool.pyright]
include = ["app", "scripts"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
